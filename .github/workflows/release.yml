# Drafts a GitHub release when a tag v<version> is pushed (just tag).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # by hand on the tag: gh workflow run release.yml --ref v<version>

permissions: read-all

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The section `just release` wrote and the release PR edited
          awk -v tag="${TAG}" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG}"
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # PEP 440 pre-releases: v0.2.0a1, v0.2.0b1, v0.2.0rc1
          if echo "${TAG}" | grep -qE '(a|b|rc)[0-9]+$'; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "copier-canvod ${TAG#v}" \
            --notes-file release-notes.md \
            --draft \
            ${PRERELEASE} \
            --verify-tag
          echo "Draft release created; publish it by hand at https://github.com/${{ github.repository }}/releases"
